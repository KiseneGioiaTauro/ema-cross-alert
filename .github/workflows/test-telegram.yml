name: Test Telegram

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Invia messaggio di prova
        env:
          RAW_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TELEGRAM_BOT_TOKEN="$(echo -n "$RAW_TOKEN" | tr -d '[:space:]')"
          TELEGRAM_CHAT_ID="$(echo -n "$RAW_CHAT_ID" | tr -d '[:space:]')"
          echo "Lunghezza token pulito: ${#TELEGRAM_BOT_TOKEN}"
          echo "Lunghezza chat id pulito: ${#TELEGRAM_CHAT_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ Messaggio di prova — il collegamento funziona!"
