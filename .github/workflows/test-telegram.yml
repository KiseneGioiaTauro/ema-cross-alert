name: Test Telegram

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Invia messaggio di prova a entrambi i chat id
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          TOKEN="$(echo -n "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')"
          for CHAT_ID in "$TELEGRAM_CHAT_ID" "$TELEGRAM_CHAT_ID_2"; do
            CLEAN_ID="$(echo -n "$CHAT_ID" | tr -d '[:space:]')"
            if [ -n "$CLEAN_ID" ]; then
              echo "Invio a $CLEAN_ID..."
              curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${CLEAN_ID}" \
                --data-urlencode "text=✅ Test manuale — se leggi questo messaggio, il tuo telefono è collegato correttamente!"
            fi
          done
