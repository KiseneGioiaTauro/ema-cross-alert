name: Test Telegram

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla che i secrets siano validi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Lunghezza token: ${#TELEGRAM_BOT_TOKEN}"
          echo "Lunghezza chat id: ${#TELEGRAM_CHAT_ID}"
          if [[ "$TELEGRAM_BOT_TOKEN" =~ [[:space:]] ]]; then
            echo "::error::Il token contiene spazi, tab o a capo nascosti"
          fi
          if [[ "$TELEGRAM_CHAT_ID" =~ [[:space:]] ]]; then
            echo "::error::Il chat id contiene spazi, tab o a capo nascosti"
          fi
          if [[ ! "$TELEGRAM_BOT_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Il formato del token non è quello atteso (deve essere NUMERO:LETTERE-NUMERI)"
          fi
          if [[ ! "$TELEGRAM_CHAT_ID" =~ ^-?[0-9]+$ ]]; then
            echo "::error::Il chat id deve contenere solo cifre (eventualmente un - iniziale)"
          fi

      - name: Invia messaggio di prova
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ Messaggio di prova — il collegamento funziona!"
