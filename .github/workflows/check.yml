name: EMA Cross Check

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ema-cross-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Esegui controllo incrocio EMA
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          SYMBOL: ${{ vars.SYMBOL }}
          INTERVAL: ${{ vars.INTERVAL }}
          FAST_PERIOD: ${{ vars.FAST_PERIOD }}
          SLOW_PERIOD: ${{ vars.SLOW_PERIOD }}
          FAST_SOURCE: ${{ vars.FAST_SOURCE }}
          SLOW_SOURCE: ${{ vars.SLOW_SOURCE }}
        run: |
          export TWELVE_DATA_API_KEY="$(echo -n "$TWELVE_DATA_API_KEY" | tr -d '[:space:]')"
          export TELEGRAM_BOT_TOKEN="$(echo -n "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')"
          export TELEGRAM_CHAT_ID="$(echo -n "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"
          export TELEGRAM_CHAT_ID_2="$(echo -n "$TELEGRAM_CHAT_ID_2" | tr -d '[:space:]')"
          python scripts/check_cross.py

      - name: Salva lo stato se è cambiato
        run: |
          if ! git diff --quiet -- state/; then
            git config user.name "ema-cross-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/
            git commit -m "aggiorna stato ultima candela [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push fallito, ritento tra 3 secondi..."
              sleep 3
            done
          else
            echo "Nessun cambiamento di stato da salvare."
          fi
